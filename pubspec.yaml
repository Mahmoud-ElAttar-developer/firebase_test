  # UI Design & Utilities
  flutter_svg: ^2.0.7
  google_fonts: ^4.0.3
  intl: ^0.20.2
  share_plus: ^13.3.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.4"
  
  flutter_test:
    sdk: flutter
