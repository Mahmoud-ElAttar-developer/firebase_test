name: firebase_test
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: "^3.11.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # State Management & Routing
  bloc: ^9.2.1
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  go_router: ^9.0.0

  # Firebase Services
  firebase_core: ^3.1.1
